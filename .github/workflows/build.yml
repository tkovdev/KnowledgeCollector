name: Build

on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-api:
    name: Build API
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Restore API certificate
        env:
          API_CERTIFICATE_PFX_BASE64: ${{ secrets.API_CERTIFICATE_PFX_BASE64 }}
        run: |
          if [ -z "$API_CERTIFICATE_PFX_BASE64" ]; then
            echo "The API_CERTIFICATE_PFX_BASE64 Actions secret is required."
            exit 1
          fi
          mkdir -p API/Certificates
          printf '%s' "$API_CERTIFICATE_PFX_BASE64" | base64 --decode > API/Certificates/knowledgecollector.pfx

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build API
        run: dotnet build API/API.csproj --configuration Release

  build-app:
    name: Build App
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/ClientApp/package-lock.json

      - name: Install Angular dependencies
        working-directory: App/ClientApp
        run: npm ci

      - name: Build Angular app
        working-directory: App/ClientApp
        run: npm run build -- --configuration production

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish App
        run: dotnet publish App/App.csproj --configuration Release --output ./publish

      - name: Upload App artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish
